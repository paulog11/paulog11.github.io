<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shinjuku — lattice sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  /* A name plate floats over a landmark. main.ts positions it with the
     individual `translate` property; `transform` below only centres it above
     that point, so the two compose. No pointer events: a plate must never
     swallow a pan or a zoom that starts on top of it. */
  .plate {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -100%);
    padding: 2px 8px;
    background: #fff; color: #111; border: 1.5px solid #111;
    font: 600 14px/1.3 "Hiragino Mincho ProN", "Yu Mincho", "Shippori Mincho", serif;
    white-space: nowrap; pointer-events: none; user-select: none;
  }
</style>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
