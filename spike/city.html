<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spike · city grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #070a12; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="c" data-scene></canvas>
<script type="module">
import { createStage, addDaylight } from '../scene/renderer.js'
import { createStreets } from '../scene/street.js'
import { createBlocks } from '../scene/blocks.js'
import { createStation } from '../scene/station.js'
import { createTowers } from '../scene/towers.js'
import { createGoldenGaiBlock } from '../scene/alley.js'
import { createProjectBuilding } from '../scene/projectBuilding.js'
import { createOutlines } from '../scene/outline.js'
import { PROJECT_SITES } from '../scene/cityLayout.js'

// Query params let the Playwright suites drive the camera without reaching into
// OrbitControls from the test side.
const q = new URLSearchParams(location.search)
const panX = Number(q.get('panx') ?? 0)
const panZ = Number(q.get('panz') ?? 0)
const zoom = Number(q.get('zoom') ?? 0)
const only = q.get('only')          // 'roads' | 'blocks' | 'station' | 'projects' | 'towers' | 'goldengai'

// Mirrors the shape App.vue's `apps` array provides. Titles are the real ones so
// sign legibility measured here matches the real page.
const TITLES = {
  'algo-lab': 'Algorithm Lab',
  'flip7': 'Flip 7',
  'machi-koro': 'Machi Koro',
  'venue-search': 'Venue Search',
  'reading-buddy': 'Reading Buddy',
  'japan-map': 'Japan History Map',
  'right-word-japanese': 'The Right Word',
  'japanese-dashboard': 'Japanese Learning',
  'bible-hymn-kids': 'Bible Hymn Learning',
}
const STATUS = { 'venue-search': 'WIP', 'right-word-japanese': 'WIP', 'bible-hymn-kids': 'WIP' }

await document.fonts.ready

const stage = createStage(document.getElementById('c'))
addDaylight(stage.scene)

const show = (name) => !only || only === name

if (show('roads'))   stage.scene.add(createStreets())
if (show('blocks'))  stage.scene.add(createBlocks())
if (show('station')) stage.scene.add(createStation().group)
if (show('towers'))  stage.scene.add(createTowers())
if (show('goldengai')) stage.scene.add(createGoldenGaiBlock().group)

const built = []
if (show('projects')) {
  for (const site of PROJECT_SITES) {
    const project = {
      id: site.id,
      title: TITLES[site.id] ?? site.id,
      year: '2026',
      status: STATUS[site.id] ?? 'live',
      url: `./${site.id}`,
    }
    const b = createProjectBuilding(project, site)
    stage.scene.add(b.group)
    stage.addPickable(b.hit, { kind: 'project', project, hover: b.setHover })
    built.push(b)
  }
}

// Must run last, after every stage.scene.add above — see outline.js. No
// ambient layer in this harness, so nothing to skip.
stage.scene.add(createOutlines(stage.scene))

if (panX || panZ) {
  stage.controls.target.x += panX
  stage.controls.target.z += panZ
  stage.camera.position.x += panX
  stage.camera.position.z += panZ
}
if (zoom) stage.camera.zoom = zoom
stage.camera.updateProjectionMatrix()
stage.controls.update()
stage.invalidate()

stage.start()
window.__stage = stage
window.__projects = built
requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true }))
</script>
</body>
</html>
